version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: electronic_library_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: electronic_library
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - library_network

  web:
    build: .
    container_name: electronic_library_web
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=12345
      - DB_NAME=electronic_library
      - SECRET_KEY=dev-secret-key-change-me
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static:/app/static
      - ./templates:/app/templates
    ports:
      - "5000:5000"
    networks:
      - library_network

volumes:
  postgres_data:

networks:
  library_network:
    driver: bridge