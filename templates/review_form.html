{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Рецензия на книгу "{{ book.title }}"</h2>

    <form method="POST" class="review-form" id="reviewForm">
        <div class="form-group">
            <label for="rating">Оценка *</label>
            <select id="rating" name="rating" required class="form-control">
                <option value="5">5 – отлично</option>
                <option value="4">4 – хорошо</option>
                <option value="3">3 – удовлетворительно</option>
                <option value="2">2 – неудовлетворительно</option>
                <option value="1">1 – плохо</option>
                <option value="0">0 – ужасно</option>
            </select>
        </div>

        <div class="form-group">
            <label for="text">Текст рецензии * (поддерживает Markdown)</label>
            <textarea id="text" name="text" required class="form-control" rows="8" placeholder="Напишите вашу рецензию здесь..."></textarea>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-primary" onclick="submitReviewForm()">Сохранить</button>
            <a href="{{ url_for('book_detail', book_id=book.id) }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<!-- EasyMDE CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>

<script>
    let easyMDEReview;

    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('text');
        if (textarea && typeof EasyMDE !== 'undefined') {
            easyMDEReview = new EasyMDE({
                element: textarea,
                spellChecker: false,
                toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'code', 'unordered-list', 'ordered-list', '|', 'link', 'image', '|', 'preview', 'side-by-side', 'fullscreen']
            });
            console.log('EasyMDE initialized for review');
        }
    });

    function submitReviewForm() {
        if (easyMDEReview) {
            document.getElementById('text').value = easyMDEReview.value();
        }
        document.getElementById('reviewForm').submit();
    }
</script>
{% endblock %}
