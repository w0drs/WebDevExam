{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>{{ 'Редактирование книги' if book else 'Добавление книги' }}</h2>

    <form method="POST" enctype="multipart/form-data" class="book-form">
        <div class="form-group">
            <label for="title">Название *</label>
            <input type="text" id="title" name="title" value="{{ book.title if book else '' }}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="author">Автор *</label>
            <input type="text" id="author" name="author" value="{{ book.author if book else '' }}" required class="form-control">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="year">Год *</label>
                <input type="number" id="year" name="year" value="{{ book.year if book else '' }}" required class="form-control" min="1000" max="2026">
            </div>

            <div class="form-group">
                <label for="pages">Объём (страниц) *</label>
                <input type="number" id="pages" name="pages" value="{{ book.pages if book else '' }}" required class="form-control" min="1">
            </div>
        </div>

        <div class="form-group">
            <label for="publisher">Издательство *</label>
            <input type="text" id="publisher" name="publisher" value="{{ book.publisher if book else '' }}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="genres">Жанры * (Ctrl+Click для выбора нескольких)</label>
            <select id="genres" name="genres" multiple required class="form-control" size="5">
                {% for genre in genres %}
                <option value="{{ genre.id }}" {% if genre.id in selected_genres %}selected{% endif %}>
                    {{ genre.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Описание *</label>
            <textarea id="description" name="description" required class="form-control" rows="10">{{ book.description if book else '' }}</textarea>
        </div>

        {% if not book %}
        <div class="form-group">
            <label for="cover">Обложка *</label>
            <input type="file" id="cover" name="cover" accept="image/*" required class="form-control-file">
        </div>
        {% endif %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
