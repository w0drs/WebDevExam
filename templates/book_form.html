{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>{{ 'Редактирование книги' if book else 'Добавление книги' }}</h2>

    <form method="POST" enctype="multipart/form-data" class="book-form" id="bookForm">
        <div class="form-group">
            <label for="title">Название *</label>
            <input type="text" id="title" name="title" value="{{ book.title if book else '' }}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="author">Автор *</label>
            <input type="text" id="author" name="author" value="{{ book.author if book else '' }}" required class="form-control">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="year">Год *</label>
                <input type="number" id="year" name="year" value="{{ book.year if book else '' }}" required class="form-control" min="1000" max="2026">
            </div>

            <div class="form-group">
                <label for="pages">Объём (страниц) *</label>
                <input type="number" id="pages" name="pages" value="{{ book.pages if book else '' }}" required class="form-control" min="1">
            </div>
        </div>

        <div class="form-group">
            <label for="publisher">Издательство *</label>
            <input type="text" id="publisher" name="publisher" value="{{ book.publisher if book else '' }}" required class="form-control">
        </div>

        <div class="form-group">
            <label for="genres">Жанры * (Ctrl+Click для выбора нескольких)</label>
            <select id="genres" name="genres" multiple required class="form-control" size="5">
                {% for genre in genres %}
                <option value="{{ genre.id }}" {% if genre.id in selected_genres %}selected{% endif %}>
                    {{ genre.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Описание * (поддерживает Markdown)</label>
            <textarea id="description" name="description" required class="form-control" rows="10">{{ book.description if book else '' }}</textarea>
        </div>

        {% if not book %}
        <div class="form-group">
            <label for="cover">Обложка *</label>
            <input type="file" id="cover" name="cover" accept="image/*" required class="form-control-file">
        </div>
        {% endif %}

        <div class="form-actions">
            <button type="button" class="btn btn-primary" onclick="submitForm()">Сохранить</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<!-- EasyMDE CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>

<script>
    let easyMDE;

    // Инициализация EasyMDE после загрузки страницы
    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('description');
        if (textarea && typeof EasyMDE !== 'undefined') {
            easyMDE = new EasyMDE({
                element: textarea,
                spellChecker: false,
                toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'code', 'unordered-list', 'ordered-list', '|', 'link', 'image', '|', 'preview', 'side-by-side', 'fullscreen']
            });
            console.log('EasyMDE initialized');
        } else {
            console.log('EasyMDE not loaded');
        }
    });

    function submitForm() {
        console.log('Button clicked, submitting form...');

        // Обновляем значение textarea из EasyMDE
        if (easyMDE) {
            document.getElementById('description').value = easyMDE.value();
            console.log('Updated description from EasyMDE');
        }

        const form = document.getElementById('bookForm');

        // Проверяем заполненность полей
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const year = document.getElementById('year').value;
        const pages = document.getElementById('pages').value;
        const publisher = document.getElementById('publisher').value;
        const genres = document.getElementById('genres').selectedOptions.length;
        const description = document.getElementById('description').value;
        const cover = document.getElementById('cover');

        if (!title || !author || !year || !pages || !publisher || genres === 0 || !description) {
            alert('Пожалуйста, заполните все поля!');
            return;
        }

        if (cover && (!cover.files || cover.files.length === 0)) {
            alert('Пожалуйста, загрузите обложку!');
            return;
        }

        form.submit();
        console.log('Form submitted');
    }
</script>
{% endblock %}
